<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../Css/pratica.css">
    <title>Meu Console JavaScript</title>
</head>
<body>
    <div class="container">
        <div class="editor-side">
        
        <h2 id="questao" style="margin-left: 15px; padding: 10px;">Faça um algoritmo que utilize a <code>estrutura de repeticao</code> de acordo com o conteúdo mostrado</h2>
        <div class="label">Editor JavaScript</div>
  
    <div class="editor-container">
        
        <div id="js-highlight" aria-hidden="true"></div>
        
        <textarea id="js-input" spellcheck="false"></textarea>
    </div>
</div>
        <div class="preview-side">
            <div class="label">Resultado (Console)</div>
            <div id="console-output" class="console-output"></div>
            <div class="toolbar" style="padding: 8.3px;">
                <button class="btn-run" onclick="runJavaScript()" style="margin-left: 7px;">Executar Código ❯</button>
                <button class="btn-clear" onclick="clearConsole()">Limpar Saída</button>
                <button id="anterior" class="btn-clear"><a href="../../Menus/Conteudo.html">Anterior</a></button>
            </div>
        </div>
        
    </div>
            
<script src="../../../Js/Pratica.js"></script>
</body>
</html>
